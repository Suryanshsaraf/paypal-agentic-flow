services:
  - type: web
    name: get-paid
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_BASE_URL
        fromService:
          type: web
          name: get-paid
          property: host
